about:
  title: "À propos de moi"
  description: |
    Mon parcours, de l’horlogerie de luxe chez Rolex à la finance chez FlowBank, en passant par Infomaniak et son univers technologique, m’a appris une chose essentielle : le temps est l’actif le plus précieux.
    C’est pourquoi aujourd’hui, en tant qu’architecte de solutions digitales, ma mission est simple
    - vous en faire gagner !
