about:
  title: "À propos de moi"
  description: |
    Développeur full-stack basé à Genève, j'ai travaillé à la Digital Factory d'Audemars Piguet et chez Rolex. Mon parcours passe aussi par la finance chez FlowBank, par Infomaniak et par l'OCSIN (État de Genève).
    Diplômé de CREA Genève en développement web et application, je construis des applications de bout en bout, de l'API NestJS à l'interface React, Angular ou Vue. En parallèle, je développe GVA Watchmaking Guide, un guide des lieux et événements horlogers de Genève.
    Ces expériences m'ont appris une chose essentielle : le temps est l'actif le plus précieux.
