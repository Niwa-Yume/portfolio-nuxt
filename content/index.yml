testimonials:
  - quote: |
      Julien a fait preuve d’une grande autonomie et d’un excellent esprit d’équipe lors de son stage chez Rolex. Il a su apprendre rapidement, résoudre les problèmes par lui-même et s’investir pleinement dans chaque mission. Sa curiosité et sa bonne volonté ont été très appréciées au sein de l’équipe. Je recommande Julien sans hésitation pour toute future opportunité.
    author:
      name: "Jean-Christophe Plessis"
      description: "Senior Software Developer Team Lead chez Rolex"
  - quote: |
      Julien a su comprendre l'identité de The Head Spa et la retranscrire parfaitement dans notre nouveau webdesign. Son écoute, sa créativité et sa réactivité ont permis de donner une nouvelle dimension à notre site. Je recommande vivement Julien pour tout projet digital !
    author:
      name: "Céline"
      description: "Fondatrice de The Head Spa"
  - quote: |
      Grâce à l’automatisation mise en place par Julien, la gestion des conventions de stage à CREA est devenue simple et rapide. Son expertise sur n8n et son accompagnement ont permis de gagner un temps précieux et d’éviter les erreurs manuelles. Un vrai plus pour notre équipe pédagogique !
    author:
      name: "L'équipe pédagogique de CREA"
      initials: "CR"
      description: "École CREA Genève"
faq:
  title: Questions fréquentes
  categories:
    - title: Recrutement
      questions:
        - label: Quel poste recherchez-vous ?
          content: "Un poste de développeur full-stack en CDI à Genève, idéalement dans l'horlogerie, le luxe ou une grande entreprise IT."
        - label: Quand êtes-vous disponible ?
          content: "Je suis ouvert aux opportunités en CDI. Écrivez-moi pour convenir d'une date de démarrage."
        - label: Quelle est votre stack ?
          content: "NestJS, TypeScript, React, Angular, Vue/Nuxt, MongoDB/Prisma, Azure/MSAL et Java Spring Boot."
        - label: Quelle est votre formation ?
          content: "Bachelor en développement web et application à CREA Genève (2026)."
        - label: Quelles langues parlez-vous ?
          content: "Français, anglais (C1) et espagnol."
        - label: Avez-vous besoin d'un permis de travail en Suisse ?
          content: "Non. J'ai les nationalités suisse et espagnole, aucun permis de travail n'est nécessaire."
