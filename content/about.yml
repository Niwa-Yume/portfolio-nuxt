title: À propos de moi
description: Découvrez mon parcours entre technologie, design et stratégie digitale, et ma passion pour les solutions qui font gagner du temps.
content: |
  Salut, moi c’est Julien Castro, Architecte de solutions digitales basé à Genève.
  Mon parcours m’a conduit de l’horlogerie de luxe chez Rolex à la finance chez FlowBank, en passant par Infomaniak et son univers de solutions technologiques éthiques.
  Ces expériences m’ont appris une chose essentielle : le temps est le véritable actif. Aujourd’hui, ma mission est d’en faire gagner aux autres en concevant des solutions intelligentes, automatisées et agréables à utiliser.

  Diplômé de CREA Omnes Éducation Genève en développement web et application, j’ai développé une approche à la fois créative, analytique et orientée impact, à la croisée du design, de la tech et du business.

  ### Ma philosophie

  Je crois que la technologie doit simplifier, pas complexifier.
  Mon approche repose sur une idée simple : solutionner des problèmes réels et automatiser ce qui fait perdre du temps.
  J’applique les principes du Lean Startup, du DevOps et des méthodes Agile (Scrum / Kanban) pour transformer des idées en solutions concrètes — rapidement et efficacement.

  ### Ce qui me motive

  Ce qui me passionne, c’est le processus de transformation : voir un concept complexe devenir une expérience fluide, utile et élégante.
  Chaque projet est pour moi une exploration où stratégie, créativité et technologie se rencontrent pour créer de la valeur réelle.

  ### Au-delà de l’écran

  Quand je ne conçois pas d’expériences digitales, je plonge dans mes autres univers :
  - 🥋 **Jujitsu et arts martiaux** – rigueur, focus, dépassement de soi.
  - 🏎️ **Formule 1** – précision, stratégie et performance.
  - 🍷 **Œnologie et cuisine** – équilibre et créativité.
  - 💻 **Blockchain, manga et webtoons** – curiosité et exploration des mondes (réels ou numériques).

  Merci d’être passé par ici.
  Découvrez mes [projets](/projects) ou [contactez-moi](mailto:julien.castro@protonmail.com) pour créer ensemble des expériences qui ont du sens.
